<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- candles -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="200" x2="150" y2="360"/>
    <line x1="256" y1="150" x2="256" y2="330"/>
    <line x1="362" y1="110" x2="362" y2="290"/>
  </g>
  <g fill="url(#accent)">
    <rect x="124" y="236" width="52" height="88" rx="12"/>
    <rect x="230" y="186" width="52" height="96" rx="12"/>
    <rect x="336" y="146" width="52" height="92" rx="12"/>
  </g>
  <!-- glow trail behind the trend line -->
  <path d="M96 372 C 170 340, 210 300, 256 250 S 350 150, 428 118" fill="none" stroke="#22d3ee" stroke-width="30" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
  <path d="M96 372 C 170 340, 210 300, 256 250 S 350 150, 428 118" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="428" cy="118" r="22" fill="#ffffff"/>
  <circle cx="428" cy="118" r="10" fill="#22d3ee"/>
</svg>
